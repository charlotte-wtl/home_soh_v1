name: Deploy Home stock to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site via the API on first run, so enabling Pages
          # is not a manual prerequisite in repo settings.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web
      - id: deployment
        uses: actions/deploy-pages@v4
